name: Documentation
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags: "*"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    uses: "SciML/.github/.github/workflows/documentation.yml@v1"
    secrets: "inherit"
